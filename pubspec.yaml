name: swipe_select
description: >-
  Swipe to multi-select for Flutter lists and grids: hold, drag, auto-scroll.
  Any item size, ListView / GridView / slivers, reverse (chat) and horizontal lists,
  edge-strip, long-press and swipe-across activation.
version: 0.1.0
homepage: https://github.com/Mironlive/swipe_select
repository: https://github.com/Mironlive/swipe_select
issue_tracker: https://github.com/Mironlive/swipe_select/issues
topics:
  - selection
  - gesture
  - listview
  - gridview
  - multi-select

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: Long press an email, checkboxes appear, drag along the checkbox column with auto-scroll.
    path: doc/media/hero.gif
  - description: Photo grid — long press, then swipe sideways to select.
    path: doc/media/grid.gif
